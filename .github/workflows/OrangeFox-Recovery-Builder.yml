name: OrangeFox Build - Garnet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo apt-get purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* mysql* php*
        sudo apt-get autoremove --purge -y
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libc6-dev libncurses5-dev libssl-dev pandas libxml2 libxml2-utils xsltproc unzip gnupg2 git python3 python-is-python3

    - name: Setup OrangeFox Sync Tool
      run: |
        mkdir ~/orangefox
        cd ~/orangefox
        git clone https://gitlab.com/OrangeFox/misc/scripts.git
        cd scripts
        sudo ./setup/android_build_env.sh
        sudo ./setup/install_android_sdk.sh || true

    - name: Sync OrangeFox Sources
      run: |
        cd ~/orangefox
        # Përdorim degën 12.1 për pajisjet moderne si Garnet
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

    - name: Clone Device Tree
      run: |
        cd ~/fox_12.1/device
        mkdir -p xiaomi
        cd xiaomi
        git clone https://gitlab.com/OrangeFox/device/garnet.git garnet

    - name: Build OrangeFox
      run: |
        cd ~/fox_12.1
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export LC_ALL="C"
        lunch twrp_garnet-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload Recovery Image
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-Garnet
        path: |
          /home/runner/fox_12.1/out/target/product/garnet/OrangeFox*.zip
          /home/runner/fox_12.1/out/target/product/garnet/recovery.img
