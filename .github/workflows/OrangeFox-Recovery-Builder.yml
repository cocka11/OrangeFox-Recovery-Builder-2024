name: Build Magisk APK

on:
  workflow_dispatch: # Ju lejon ta nxisni manualisht nga shfletuesi i telefonit
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Klonimi i depos bashkë me submodules (Rust & C++ dependencies)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # 2. Konfigurimi i Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Instalimi i Rust Toolchain (i domosdoshëm për modulin native të Magisk)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86-linux-android, x86_64-linux-android

      # 4. Instalimi i Android NDK dhe SDK tools
      - name: Setup Android NDK
        uses: ndk-ndk/setup-ndk@v1
        with:
          ndk-version: r26b

      # 5. Ekzekutimi i kompilimit përmes Python build script ose Gradle
      - name: Build Magisk App
        run: |
          python3 build.py setup
          python3 build.py app

      # 6. Ruajtja e APK-së së ndërtuar te Artifacts
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Magisk-Release-APK
          path: |
            out/app-release.apk
            out/*.apk
            app/build/outputs/apk/*/*/*.apk
