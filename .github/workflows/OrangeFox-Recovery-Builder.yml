name: Recovery Builder (TWRP & OrangeFox) - Garnet

on:
  workflow_dispatch:
    inputs:
      RECOVERY_TYPE:
        description: 'Zgjidh Llojin e Recovery'
        required: true
        default: 'TWRP'
        type: choice
        options:
        - TWRP
        - OrangeFox
      MANIFEST_BRANCH:
        description: 'Recovery Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
        - twrp-12.1
        - twrp-11
        - orangefox-12.1
      DEVICE_TREE:
        description: 'Device Tree URL'
        required: true
        [span_0](start_span)default: 'https://github.com/boedhack99/device_xiaomi_garnet-TWRP'[span_0](end_span)
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        [span_1](start_span)default: 'device/xiaomi/garnet'[span_1](end_span)
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        [span_2](start_span)default: 'garnet'[span_2](end_span)
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recoveryimage'
        type: choice
        options:
        - bootimage
        - recoveryimage

jobs:
  build:
    [span_3](start_span)name: Build ${{ inputs.RECOVERY_TYPE }} by ${{ github.actor }}[span_3](end_span)
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Pastrimi i Hapësirës
      run: |
        [span_4](start_span)echo "Lirimi i hapsires..."[span_4](end_span)
        [span_5](start_span)sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/share/boost || true[span_5](end_span)

    - name: Konfigurimi i Swap (24GB)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Instalo Varësitë
      run: |
        [span_6](start_span)sudo apt update[span_6](end_span)
        [span_7](start_span)sudo apt install bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev -y[span_7](end_span)
        [span_8](start_span)sudo curl --create-dirs -L -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo[span_8](end_span)
        [span_9](start_span)sudo chmod a+rx /usr/local/bin/repo[span_9](end_span)

    - name: Sinkronizimi i Manifestit
      run: |
        [span_10](start_span)mkdir -p ${GITHUB_WORKSPACE}/workspace[span_10](end_span)
        cd ${GITHUB_WORKSPACE}/workspace
        if [ "${{ inputs.RECOVERY_TYPE }}" == "TWRP" ]; then
          [span_11](start_span)repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ inputs.MANIFEST_BRANCH }}[span_11](end_span)
        else
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b ${{ inputs.MANIFEST_BRANCH }}
        fi
        [span_12](start_span)repo sync -j$(nproc)[span_12](end_span)

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/workspace
        [span_13](start_span)git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}[span_13](end_span)
        cd ${{ inputs.DEVICE_PATH }}
        [span_14](start_span)echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV[span_14](end_span)

    - name: Build Recovery
      run: |
        cd ${GITHUB_WORKSPACE}/workspace
        source build/envsetup.sh
        if [ "${{ inputs.RECOVERY_TYPE }}" == "TWRP" ]; then
          [span_15](start_span)lunch twrp_${{ inputs.DEVICE_NAME }}-eng[span_15](end_span)
          [span_16](start_span)mka ${{ inputs.BUILD_TARGET }}[span_16](end_span)
        else
          lunch omni_${{ inputs.DEVICE_NAME }}-eng
          [span_17](start_span)mka orangefox[span_17](end_span)
        fi

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          [span_18](start_span)workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.img[span_18](end_span)
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
        [span_19](start_span)name: ${{ inputs.RECOVERY_TYPE }} for ${{ inputs.DEVICE_NAME }}[span_19](end_span)
        tag_name: ${{ github.run_id }}
        body: |
          ## [span_20](start_span)${{ inputs.RECOVERY_TYPE }} Build - Unofficial[span_20](end_span)
          * [span_21](start_span)Build Date: $(date +%Y%m%d)[span_21](end_span)
          * [span_22](start_span)Device: [Device Tree](${{ inputs.DEVICE_TREE }})[span_22](end_span)
          * [span_23](start_span)Branch: ${{ inputs.MANIFEST_BRANCH }}[span_23](end_span)
