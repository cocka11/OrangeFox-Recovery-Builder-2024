name: Recovery Builder (TWRP & OrangeFox) - Garnet

on:
  workflow_dispatch:
    inputs:
      RECOVERY_TYPE:
        description: 'Zgjidh Llojin e Recovery'
        required: true
        default: 'TWRP'
        type: choice
        options:
        - TWRP
        - OrangeFox
      MANIFEST_BRANCH:
        description: 'Recovery Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
        - twrp-12.1
        - twrp-11
        - fox_12.1
      DEVICE_TREE:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/boedhack99/device_xiaomi_garnet-TWRP'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'android-12.1'
        type: choice
        options:
        - fox_12.1
        - twrp-12.1
        - twrp-11
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/xiaomi/garnet'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'garnet'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recoveryimage'
        type: choice
        options:
        - bootimage
        - recoveryimage

jobs:
  build:
    name: Build ${{ inputs.RECOVERY_TYPE }} by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Pastrimi i Hapësirës
      run: |
        echo "Lirimi i hapsires..."
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/share/boost || true

    - name: Konfigurimi i Swap (24GB)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Instalo Varësitë
      run: |
        sudo apt update[span_6](end_span)
        sudo apt install bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev -y
        sudo curl --create-dirs -L -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
        sudo chmod a+rx /usr/local/bin/repo

    - name: Sinkronizimi i Manifestit
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/workspace
        cd ${GITHUB_WORKSPACE}/workspace
        if [ "${{ inputs.RECOVERY_TYPE }}" == "TWRP" ]; then
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ inputs.MANIFEST_BRANCH }}
        else
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b ${{ inputs.MANIFEST_BRANCH }}
        fi
        repo sync -j$(nproc)

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/workspace
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Build Recovery
      run: |
        cd ${GITHUB_WORKSPACE}/workspace
        source build/envsetup.sh
        if [ "${{ inputs.RECOVERY_TYPE }}" == "TWRP" ]; then
          lunch twrp_${{ inputs.DEVICE_NAME }}-eng
          mka ${{ inputs.BUILD_TARGET }}
        else
          lunch omni_${{ inputs.DEVICE_NAME }}-eng
          mka orangefox
        fi

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
        name: ${{ inputs.RECOVERY_TYPE }} for ${{ inputs.DEVICE_NAME }}
        tag_name: ${{ github.run_id }}
        body: |
          ${{ inputs.RECOVERY_TYPE }} Build - Unofficial
          Build Date: $(date +%Y%m%d)[span_21](end_span)
          Device: [Device Tree](${{ inputs.DEVICE_TREE }})
          Branch: ${{ inputs.MANIFEST_BRANCH }}
