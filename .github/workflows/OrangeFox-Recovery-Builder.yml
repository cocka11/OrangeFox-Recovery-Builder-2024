name: OrangeFox Build - Garnet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        docker image prune -a -f || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/share/boost || true
        sudo apt-get update
        sudo apt-get purge -y azure-cli google-cloud-sdk microsoft-edge-stable google-chrome-stable firefox dotnet-sdk-* openjdk* || true
        sudo apt-get autoremove -y
        sudo apt-get clean

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gperf gcc-multilib g++-multilib lib32ncurses5-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc bison build-essential curl flex git gnupg gperf liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 python3-full python-is-python3 zip zlib1g-dev imagebuilder

    - name: Setup OrangeFox Sync Tool
      run: |
        mkdir ~/orangefox
        cd ~/orangefox
        git clone https://gitlab.com/OrangeFox/misc/scripts.git
        cd scripts
        sudo ./setup/android_build_env.sh || true

    - name: Sync OrangeFox Sources
      run: |
        mkdir -p ~/fox_12.1
        cd ~/fox_12.1
        # Perdorim repo direkt per me shume stabilitet
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

    - name: Clone Device Tree
      run: |
        cd ~/fox_12.1/device
        mkdir -p xiaomi
        cd xiaomi
        git clone https://gitlab.com/OrangeFox/device/garnet.git garnet

    - name: Build OrangeFox
      run: |
        cd ~/fox_12.1
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export LC_ALL="C"
        lunch twrp_garnet-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload Recovery Image
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-Garnet
        path: |
          /home/runner/fox_12.1/out/target/product/garnet/OrangeFox*.zip
          /home/runner/fox_12.1/out/target/product/garnet/recovery.img
