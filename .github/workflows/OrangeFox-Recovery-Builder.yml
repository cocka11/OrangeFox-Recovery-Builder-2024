name: Build OrangeFox - garnet

on:
  workflow_dispatch: # Lejon nisjen manuale të build-it

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rritja e hapësirës në Disk
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Instalimi i Varësive (Dependencies)
        run: |
          sudo apt update
          sudo apt install -y bc build-essential python3-setuptools x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip gperf bison clang cmake git-core gnupg flex curl lzop libncurses5-dev libsdl1.2-dev libssl-dev libxml2 python2-minimal rsync schedtool squashfs-tools wget zip zlib1g-dev

      - name: Konfigurimi i Repo
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Konfigurimi i Git dhe Sinkronizimi (Fix Final)
        run: |
          # 1. Pastrim total i konfigurimeve që mund të shkaktojnë kërkesë për login
          git config --global --unset-all url."https://github.com/".insteadOf || true
          git config --global --unset-all url."git@github.com:".insteadOf || true
          
          # 2. Konfigurim minimal
          git config --global user.email "orangefox@build.bot"
          git config --global user.name "OrangeFox"
          
          # 3. Instalimi i një versioni më të qëndrueshëm të 'repo'
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH="$HOME/bin:$PATH"

          # 4. Sinkronizimi duke përdorur TOKEN-in e vetë GitHub-it që ka ky runner
          mkdir ~/fox && cd ~/fox
          # Kjo detyron përdorimin e tokenit të përkohshëm të workflow-it për çdo kërkesë git
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          
          repo init --depth=1 -u https://github.com/OrangeFoxRecovery/Manifest.git -b fox_12.1 --no-repo-verify
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clonimi i Device Tree
        run: |
          cd ~/fox
          git clone https://gitlab.com/OrangeFox/device/garnet.git device/xiaomi/garnet

      - name: Ndërtimi (Build) i OrangeFox
        run: |
          cd ~/fox
          set -e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_REPLACE_TOOLBOX=1
          export LC_ALL="C"
          lunch twrp_garnet-eng
          mka adbd recoveryimage -j$(nproc --all)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Garnet
          path: ~/fox/out/target/product/garnet/OrangeFox-*.zip
          
