name: Build OrangeFox - garnet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pastrim i Sistemit dhe Hapësirës
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          # Fshijmë çdo konfigurim të mundshëm të mbetur nga build-et e kaluara
          rm -rf ~/.gitconfig
          rm -rf ~/.ssh

      - name: Instalimi i Varësive
        run: |
          sudo apt update
          sudo apt install -y bc build-essential python3-setuptools x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip gperf bison clang cmake git-core gnupg flex curl lzop libncurses5-dev libsdl1.2-dev libssl-dev libxml2 python3-minimal rsync     schedtool squashfs-tools wget zip zlib1g-dev

      - name: Konfigurimi i Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Sinkronizimi (Metoda pa 'repo init')
        run: |
          # 1. Pastrim dhe Konfigurim
          git config --global user.email "bot@build.bot"
          git config --global user.name "Builder"
          
          mkdir ~/fox && cd ~/fox
          
          # 2. Shkarkojmë manifestin manualisht me git clone (Kjo nuk dështon kurrë)
          # Kjo shmang përdorimin e 'repo init' që po të jep gabimin e autentikimit
          git clone https://github.com/OrangeFoxRecovery/Manifest.git -b fox_12.1 .repo/manifests
          
          # 3. Kopjojmë skedarin default.xml në vendin e duhur
          cp .repo/manifests/default.xml .repo/manifest.xml
          
          # 4. Tani ekzekutojmë vetëm sync
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

      - name: Clonimi i Device Tree (Garnet)
        run: |
          cd ~/fox
          # Kjo është pika ku shkarkohen skedarët specifikë për telefonin tënd
          git clone https://gitlab.com/OrangeFox/device/garnet.git device/xiaomi/garnet

      - name: Ndërtimi (Build)
        run: |
          cd ~/fox
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_REPLACE_TOOLBOX=1
          export LC_ALL="C"
          # Komanda specifike për Garnet
          lunch twrp_garnet-eng
          mka adbd recoveryimage -j$(nproc --all)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Garnet
          path: ~/fox/out/target/product/garnet/OrangeFox-*.zip
          
