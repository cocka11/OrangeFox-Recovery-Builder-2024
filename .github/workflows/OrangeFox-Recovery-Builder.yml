name: OrangeFox Recovery Builder - Garnet

on:
  workflow_dispatch:
    inputs:
      RECOVERY_TYPE:
        description: 'Zgjidh Llojin e Recovery'
        required: true
        default: 'OrangeFox'
        type: choice
        options:
        - OrangeFox
        - TWRP
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: 'fox_12.1'
        type: choice
        options:
        - fox_12.1
        - twrp-12.1
      DEVICE_TREE:
        description: 'Device Tree URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/device/garnet.git'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'fox_12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/xiaomi/garnet'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'garnet'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recoveryimage'

jobs:
  build:
    name: Build ${{ inputs.RECOVERY_TYPE }} by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Pastrimi i Hapësirës
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/share/boost || true

    - name: Konfigurimi i Swap (24GB)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Instalo Varësitë
      run: |
        sudo apt update
        sudo apt install bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 -y
        sudo curl --create-dirs -L -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
        sudo chmod a+rx /usr/local/bin/repo

    - name: Sinkronizimi i Manifestit
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/workspace
        cd ${GITHUB_WORKSPACE}/workspace
        if [ "${{ inputs.RECOVERY_TYPE }}" == "TWRP" ]; then
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ inputs.MANIFEST_BRANCH }}
        else
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b ${{ inputs.MANIFEST_BRANCH }}
        fi
        repo sync -j$(nproc) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/workspace
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git -C ./${{ inputs.DEVICE_PATH }} rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Build Recovery
      run: |
        cd ${GITHUB_WORKSPACE}/workspace
        source build/envsetup.sh
        if [ "${{ inputs.RECOVERY_TYPE }}" == "OrangeFox" ]; then
          lunch orangefox_${{ inputs.DEVICE_NAME }}-eng || lunch omni_${{ inputs.DEVICE_NAME }}-eng
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_VERSION="R11.1"
          export LC_ALL="C"
          mka orangefox
        else
          lunch twrp_${{ inputs.DEVICE_NAME }}-eng
          mka ${{ inputs.BUILD_TARGET }}
        fi

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
        name: ${{ inputs.RECOVERY_TYPE }} for ${{ inputs.DEVICE_NAME }}
        tag_name: ${{ github.run_id }}
        body: |
          **Pajisja:** ${{ inputs.DEVICE_NAME }}
          **Lloji:** ${{ inputs.RECOVERY_TYPE }} Unofficial
          **Manifest:** ${{ inputs.MANIFEST_BRANCH }}
          **Commit:** ${{ env.COMMIT_ID }}
          **Data:** $(date +'%Y-%m-%d %H:%M')
          
